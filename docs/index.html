<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSA Practice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* layout: single-column dashboard, heatmap up top, stats + tables below */
:root {
  --bg: #0d1117;
  --bg-card: #161b22;
  --fg: #c9d1d9;
  --fg-muted: #8b949e;
  --fg-bright: #e6edf3;
  --accent: #58a6ff;
  --green-0: #161b22;
  --green-1: #0e4429;
  --green-2: #006d32;
  --green-3: #26a641;
  --green-4: #39d353;
  --border: #30363d;
  --red: #f85149;
  --yellow: #d29922;
  --orange: #db6d28;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f6f8fa;
    --bg-card: #ffffff;
    --fg: #1f2328;
    --fg-muted: #656d76;
    --fg-bright: #1f2328;
    --accent: #0969da;
    --green-0: #ebedf0;
    --green-1: #9be9a8;
    --green-2: #40c463;
    --green-3: #30a14e;
    --green-4: #216e39;
    --border: #d0d7de;
    --red: #cf222e;
    --yellow: #bf8700;
    --orange: #bc4c00;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f6f8fa;
  --bg-card: #ffffff;
  --fg: #1f2328;
  --fg-muted: #656d76;
  --fg-bright: #1f2328;
  --accent: #0969da;
  --green-0: #ebedf0;
  --green-1: #9be9a8;
  --green-2: #40c463;
  --green-3: #30a14e;
  --green-4: #216e39;
  --border: #d0d7de;
  --red: #cf222e;
  --yellow: #bf8700;
  --orange: #bc4c00;
  color-scheme: light;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Inter', -apple-system, sans-serif;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
}
.wrap { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
h1 { font-size: 1.6rem; font-weight: 700; color: var(--fg-bright); }
h1 small { font-weight: 400; color: var(--fg-muted); font-size: 0.85rem; margin-left: 8px; }
h2 { font-size: 1rem; font-weight: 600; color: var(--fg-bright); margin-bottom: 12px; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.stat {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
}
.stat-value { font-family: 'JetBrains Mono', monospace; font-size: 1.8rem; font-weight: 600; color: var(--fg-bright); font-variant-numeric: tabular-nums; }
.stat-label { font-size: 0.78rem; color: var(--fg-muted); margin-top: 2px; }

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
}

/* heatmap */
.heatmap-scroll { overflow-x: auto; }
.heatmap { display: flex; gap: 3px; }
.heatmap-col { display: flex; flex-direction: column; gap: 3px; }
.heatmap-cell {
  width: 12px; height: 12px;
  border-radius: 2px;
  background: var(--green-0);
}
.heatmap-cell[data-level="1"] { background: var(--green-1); }
.heatmap-cell[data-level="2"] { background: var(--green-2); }
.heatmap-cell[data-level="3"] { background: var(--green-3); }
.heatmap-cell[data-level="4"] { background: var(--green-4); }
.heatmap-cell:hover { outline: 1px solid var(--fg-muted); outline-offset: -1px; }
.heatmap-months { display: flex; font-size: 0.7rem; color: var(--fg-muted); margin-bottom: 4px; }
.heatmap-months span { flex: none; }
.heatmap-days { display: flex; flex-direction: column; gap: 3px; font-size: 0.65rem; color: var(--fg-muted); margin-right: 6px; padding-top: 1px; }
.heatmap-days span { height: 12px; line-height: 12px; }
.heatmap-wrap { display: flex; }
.heatmap-legend { display: flex; align-items: center; gap: 4px; font-size: 0.7rem; color: var(--fg-muted); margin-top: 8px; justify-content: flex-end; }
.heatmap-legend .heatmap-cell { width: 10px; height: 10px; cursor: default; }

.tooltip {
  position: fixed;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 6px 10px;
  font-size: 0.75rem;
  color: var(--fg);
  pointer-events: none;
  z-index: 100;
  white-space: nowrap;
  display: none;
}

/* tier table */
.tier-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.tier-table th { text-align: left; font-size: 0.72rem; color: var(--fg-muted); font-weight: 500; padding: 6px 10px; border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.04em; }
.tier-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
.tier-table tr:last-child td { border-bottom: none; }
.tier-table .num { text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; }

.bar-track { width: 100%; height: 6px; background: var(--green-0); border-radius: 3px; overflow: hidden; min-width: 80px; }
.bar-fill { height: 100%; background: var(--green-3); border-radius: 3px; transition: width 0.4s ease; }

/* due list */
.due-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
.due-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px;
  background: var(--bg);
  border-radius: 6px;
  font-size: 0.85rem;
}
.due-item .slug { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--fg-bright); min-width: 0; }
.due-item .meta { color: var(--fg-muted); font-size: 0.75rem; margin-left: auto; white-space: nowrap; }
.badge {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 10px;
  font-size: 0.7rem;
  font-weight: 600;
  flex-shrink: 0;
}
.badge-easy { background: #238636; color: #fff; }
.badge-medium { background: var(--yellow); color: #fff; }
.badge-hard { background: var(--red); color: #fff; }
.badge-drill { background: var(--accent); color: #fff; }

.group-label { font-size: 0.78rem; color: var(--fg-muted); padding: 10px 0 4px; display: flex; align-items: center; gap: 8px; }
.group-count { background: var(--accent); color: #fff; font-size: 0.7rem; font-weight: 600; padding: 1px 7px; border-radius: 10px; }
.empty { color: var(--fg-muted); font-size: 0.85rem; font-style: italic; }

.due-item.tappable { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.due-item.tappable:active { background: var(--border); }

/* statement modal */
.modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.6); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
}
.modal-overlay.open { display: flex; align-items: flex-end; justify-content: center; }
.modal {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 16px 16px 0 0; width: 100%; max-width: 640px;
  max-height: 92vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 0; animation: slideUp 0.25s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-handle { width: 36px; height: 4px; background: var(--fg-muted); border-radius: 2px; margin: 10px auto 0; opacity: 0.5; }
.modal-header {
  position: sticky; top: 0; background: var(--bg-card); z-index: 1;
  padding: 16px 20px 12px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-header h3 { font-size: 0.95rem; font-weight: 600; color: var(--fg-bright); margin: 0; word-break: break-word; }
.modal-close {
  background: none; border: none; color: var(--fg-muted); font-size: 1.5rem;
  padding: 4px 8px; cursor: pointer; flex-shrink: 0; line-height: 1;
}
.modal-body {
  padding: 16px 20px 32px; font-size: 0.88rem; line-height: 1.6;
  padding-bottom: max(32px, env(safe-area-inset-bottom, 0px));
}
.modal-body h1, .modal-body h2 { font-size: 0.92rem; font-weight: 600; color: var(--fg-bright); margin: 18px 0 8px; }
.modal-body h1:first-child { margin-top: 0; }
.modal-body p { margin: 8px 0; }
.modal-body ul, .modal-body ol { margin: 8px 0; padding-left: 20px; }
.modal-body code {
  font-family: 'JetBrains Mono', monospace; font-size: 0.82rem;
  background: var(--bg); padding: 1px 5px; border-radius: 3px;
}
.modal-body pre {
  background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  padding: 12px 14px; overflow-x: auto; margin: 10px 0;
  font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; line-height: 1.5;
}
.modal-body pre code { background: none; padding: 0; }

@media (max-width: 600px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .due-item { flex-wrap: wrap; }
  .due-item .meta { margin-left: 0; }
}
@media (min-width: 641px) {
  .modal { border-radius: 12px; max-height: 85vh; margin-bottom: 5vh; }
  .modal-handle { display: none; }
}

/* catch-up / mark-done */
.done-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--green-2); color: #fff; border: none; border-radius: 8px;
  padding: 10px 18px; font-size: 0.88rem; font-weight: 600; cursor: pointer;
  width: 100%; justify-content: center; margin-top: 12px;
  -webkit-tap-highlight-color: transparent;
}
.done-btn.is-done { background: var(--fg-muted); }
.done-btn:active { opacity: 0.8; }
.due-item .done-check {
  color: var(--green-4); font-weight: 700; margin-right: 4px; flex-shrink: 0;
}
.due-item.marked-done .slug { text-decoration: line-through; opacity: 0.5; }
.catchup-card { border-left: 3px solid var(--green-4); }
.catchup-card .catchup-list { list-style: none; padding: 0; margin: 8px 0 0; }
.catchup-card .catchup-list li {
  padding: 6px 0; font-family: 'JetBrains Mono', monospace; font-size: 0.82rem;
  display: flex; align-items: center; gap: 8px;
}
.catchup-card .catchup-list li .undo-btn {
  background: none; border: none; color: var(--red); font-size: 0.78rem;
  cursor: pointer; padding: 2px 6px; -webkit-tap-highlight-color: transparent;
}
.catchup-copy {
  background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  padding: 10px 14px; font-family: 'JetBrains Mono', monospace; font-size: 0.78rem;
  line-height: 1.5; margin: 10px 0 0; white-space: pre-wrap; word-break: break-all;
  color: var(--fg); user-select: all; -webkit-user-select: all;
}
.copy-hint { font-size: 0.75rem; color: var(--fg-muted); margin-top: 4px; }
</style>

</head>
<body>
<div class="wrap">
  <h1>DSA Practice <small>progress dashboard</small></h1>
  <div class="stats" id="stats"></div>
  <div class="card">
    <h2>Activity</h2>
    <div class="heatmap-scroll" id="heatmap-container"></div>
  </div>
  <div class="card">
    <h2>Progress by Tier</h2>
    <div style="overflow-x:auto"><table class="tier-table" id="tier-table"></table></div>
  </div>
  <div class="card catchup-card" id="catchup-card" style="display:none">
    <h2>Catch-up <span id="catchup-count" class="group-count"></span></h2>
    <p style="color:var(--fg-muted);font-size:0.82rem;margin:0 0 8px">Marked done on phone — run these when back on your machine</p>
    <ul class="catchup-list" id="catchup-list"></ul>
    <div class="catchup-copy" id="catchup-copy"></div>
    <div class="copy-hint">Tap above to select, then copy</div>
  </div>
  <div class="card">
    <h2>Due Today</h2>
    <div id="due-today"></div>
  </div>
  <div class="card">
    <h2>Upcoming</h2>
    <div id="upcoming"></div>
  </div>
  <div style="text-align:center;padding:16px 0">
    <small style="color:var(--fg-muted)">Generated <span id="gen-time"></span></small>
  </div>
</div>
<div class="tooltip" id="tooltip"></div>
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <h3 id="modal-title"></h3>
      <button class="modal-close" id="modal-close">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>
